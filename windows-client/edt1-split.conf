# edt1 WireGuard tunnel - SPLIT TUNNEL (Windows client, ELT3)
#
# Only edt1's networks go through the tunnel; normal internet traffic keeps using
# the local connection. Use this when you want edt1 access without routing your
# whole machine through it.
#
# NOTE: with this profile internet traffic does NOT egress via 192.168.2.254.
# If that is a requirement, use edt1-full.conf.

[Interface]
PrivateKey = REPLACE_WITH_YOUR_CLIENT_PRIVATE_KEY
Address    = 172.16.0.11/32
MTU        = 1420

# No DNS line on purpose. A DNS server that is only reachable THROUGH the tunnel
# becomes the resolver for every query the moment the tunnel is up, so if the
# tunnel is degraded, name resolution stops system-wide and presents as "the
# internet is down". With a split tunnel keep your normal resolver; reach edt1
# hosts by IP, or add "DNS = 172.16.4.1" knowingly.

PreUp    = powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%ProgramFiles%\edt1-wg\wg-hooks.ps1" -Phase PreUp    -Interface "%WIREGUARD_TUNNEL_NAME%"
PostUp   = powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%ProgramFiles%\edt1-wg\wg-hooks.ps1" -Phase PostUp   -Interface "%WIREGUARD_TUNNEL_NAME%"
PreDown  = powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%ProgramFiles%\edt1-wg\wg-hooks.ps1" -Phase PreDown  -Interface "%WIREGUARD_TUNNEL_NAME%"
PostDown = powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%ProgramFiles%\edt1-wg\wg-hooks.ps1" -Phase PostDown -Interface "%WIREGUARD_TUNNEL_NAME%"

[Peer]
PublicKey = WBSO/UUF0l6NDmljyP8mnVDJbZziJG5UUTp1+Rn4MAM=

# Every network edt1 can route to, verified reachable from a tunnelled client.
# WARNING: 192.168.2.0/24 is edt1's LAN. If the network you are connecting FROM
# also uses 192.168.2.x, this line captures your own gateway and breaks local
# connectivity - drop it in that case and reach edt1 by its tunnel address.
AllowedIPs = 172.16.0.0/24, 172.16.4.0/24, 172.15.4.0/24, 172.20.10.0/24, 172.30.10.0/24, 10.90.0.0/24, 10.88.0.0/16, 192.168.122.0/24, 192.168.2.0/24

Endpoint = 45.19.59.138:1911
PersistentKeepalive = 25
