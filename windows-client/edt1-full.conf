# edt1 WireGuard tunnel - FULL TUNNEL (Windows client, ELT3)
#
# All traffic, including internet, is carried through the tunnel and egresses
# edt1 via the LAN gateway 192.168.2.254. That is what makes this the "full"
# profile; for a split tunnel use edt1-split.conf instead.
#
# The hooks below are IGNORED unless script execution is enabled - see README.md.
# The tunnel works without them; they only add verification and the container
# forwarding setup.

[Interface]
PrivateKey = REPLACE_WITH_YOUR_CLIENT_PRIVATE_KEY
Address    = 172.16.0.11/32
DNS        = 172.16.4.1

# 1420 leaves room for the WireGuard header inside a 1500-byte path. Raising it
# causes large packets to vanish rather than fail cleanly, which presents as
# "SSH works, web pages hang".
MTU        = 1420

PreUp    = powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%ProgramFiles%\edt1-wg\wg-hooks.ps1" -Phase PreUp    -Interface "%WIREGUARD_TUNNEL_NAME%"
PostUp   = powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%ProgramFiles%\edt1-wg\wg-hooks.ps1" -Phase PostUp   -Interface "%WIREGUARD_TUNNEL_NAME%"
PreDown  = powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%ProgramFiles%\edt1-wg\wg-hooks.ps1" -Phase PreDown  -Interface "%WIREGUARD_TUNNEL_NAME%"
PostDown = powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%ProgramFiles%\edt1-wg\wg-hooks.ps1" -Phase PostDown -Interface "%WIREGUARD_TUNNEL_NAME%"

[Peer]
PublicKey = WBSO/UUF0l6NDmljyP8mnVDJbZziJG5UUTp1+Rn4MAM=

# 0.0.0.0/0 sends everything down the tunnel. edt1 masquerades it onto bridge0
# and forwards it to 192.168.2.254, so the internet path is edt1's, not the
# hotspot's. This single line is what satisfies "internet egresses via .254".
AllowedIPs = 0.0.0.0/0

Endpoint = 45.19.59.138:1911

# The public port is 1911; edt1's wg0 listens on 51820 and the router translates
# between them. Do not "correct" this to 51820 - that port is not open publicly.

# Keeps the NAT mapping alive on the hotspot's carrier-grade NAT, which silently
# drops idle UDP flows.
PersistentKeepalive = 25
